gui:
  construct:
    title: "Construct Manager{0}"
    suffix-editor: " [EDITOR]"
    suffix-tool: " [{0}]"

    classic-mode:
      name: "Classic Mode"
      lore:
        - "One point in the center."
        - "Standard brush behavior."
        - ""
        - "Status: {0}"
      status-active: "ACTIVE"
      status-inactive: "INACTIVE"

    group-item:
      lore-count: "Elements: {0}"
      status-multi: "IN LIST (Random)"
